plugins {
    // 使用已验证兼容 Gradle 8.8 的 Fabric Loom 配置 1.19.2 开发环境。
    id 'fabric-loom' version "${loom_version}"
    id 'java'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    // Minecraft 1.19.2 使用 Java 17 编译与运行。
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    withSourcesJar()
}

repositories {
    // 从 Fabric 官方 Maven 解析 Loom、Yarn 与 Fabric Loader。
    maven { url = 'https://maven.fabricmc.net/' }
}

dependencies {
    // 仅声明 Minecraft、Yarn 映射与 Fabric Loader，不引入额外游戏模组依赖。
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings "net.fabricmc:yarn:${yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${loader_version}"
    // 使用 Fabric Resource Loader 将模组内 data 数据包加入服务端动态注册表。
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

loom {
    // 固定 Mixin refmap 名称，保持现有资源契约。
    mixin.setDefaultRefmapName("${mod_id}.refmap.json")
}

processResources {
    // 展开 Fabric 元数据中的项目属性并统一使用 UTF-8。
    inputs.properties([
        minecraft_version: minecraft_version,
        loader_version: loader_version,
        mod_id: mod_id,
        mod_name: mod_name,
        mod_license: mod_license,
        mod_version: project.version,
        mod_description: mod_description,
        fabric_api_version: fabric_api_version
    ])
    filteringCharset = 'UTF-8'
    filesMatching('fabric.mod.json') {
        expand([
            minecraft_version: minecraft_version,
            loader_version: loader_version,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: project.version,
            mod_description: mod_description,
            fabric_api_version: fabric_api_version
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    // 保证源码编码与目标字节码版本稳定。
    options.encoding = 'UTF-8'
    options.release = 17
}
